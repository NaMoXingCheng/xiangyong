<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相拥 · 关系分析室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23102030'/%3E%3Cpath d='M8 10h16v11H14l-4 4V21H8z' fill='%23e0bc72'/%3E%3Ccircle cx='13' cy='15.5' r='1.6' fill='%234fd0ff'/%3E%3Ccircle cx='19' cy='15.5' r='1.6' fill='%234fd0ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>
<button class="settings-btn" id="settingsBtn" title="设置（主题颜色 · 彩蛋 · 昵称）">⚙</button>
<div class="frame">
  <div class="topbar"><h1>相拥<b>·</b> 关系分析室</h1><span class="tag">LOCAL · CRT × ART DECO</span></div>
  <div class="credit">灵感来源于 github「她不一样」项目</div>
  <div class="deco"><span class="rhombus"></span></div>
  <div class="layout">
    <aside class="todo card" id="todoPanel">
      <div class="todo-head">
        <span class="todo-title">To Do</span><span class="todo-count" id="todoCount"></span>
        <span class="todo-collapse" id="todoCollapse" title="折叠 / 展开">⟨</span>
      </div>
      <div class="todo-body">
        <div class="todo-input-row">
          <input id="todoInput" class="todo-input" type="text" placeholder="添加待办…" autocomplete="off">
          <button id="todoAdd" class="todo-add" title="添加">＋</button>
        </div>
        <div class="todo-list" id="todoList"></div>
        <div class="todo-roast" id="todoRoast"></div>
      </div>
    </aside>
    <div class="side card">
      <button class="grab-btn" id="grabBtn" title="选中左侧联系人后开始监听剪贴板：在聊天软件里多选消息→复制，工具自动抓取并导入">📋 导入聊天记录</button>
      <div class="grab-status" id="grabStatus">① 选中左侧联系人 ② 点上方按钮 ③ 去聊天软件「多选→复制」即可自动导入</div>
      <div id="aiBar" class="ai-bar off" title="本地小AI 状态（点击可下载/查看）">🧠 本地AI 未安装 · 点此下载</div>
      <h2>联系人<button class="imp-btn" id="importOne" title="新建一个联系人（只需昵称）">＋ 新建</button></h2>
      <input id="searchInput" class="search" type="text" placeholder="搜索联系人…" autocomplete="off">
      <div id="person-list"></div>
      <div class="side-note"><b>♥</b> 勾选 = 自动分析<br><b>◆</b> 留空 = 仅存档<br><b>★</b> 置顶 · <b>×</b> 删除</div>
    </div>
    <div class="main" id="main">
      <div id="placeholder" class="ph">← 选择左侧联系人查看分析</div>
    </div>
  </div>
</div>
<div class="grass" id="grassField" aria-hidden="true"></div>
<script src="app.js?v=22"></script>
</body>
</html>
